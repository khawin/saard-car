<div id="view-profile" class="hidden-section animate-slide-up">
    <div class="glass-effect max-w-lg mx-auto rounded-[2rem] shadow-card p-6 sm:p-10 text-center">
        <div class="w-24 h-24 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6 text-blue-600 text-4xl"><i class="fas fa-user"></i></div>
        <h2 class="text-2xl font-bold text-gray-800" id="profile-name">-</h2>
        <p class="text-gray-500 mb-6" id="profile-id">-</p>
        <div class="bg-gray-50 p-6 rounded-2xl border border-gray-100 text-left space-y-4">
            <h3 class="font-bold text-gray-700 mb-2">จัดการรหัสผ่าน</h3>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">รหัสผ่านปัจจุบัน</label>
                <div class="relative">
                    <input type="password" id="current-password-display" class="custom-input bg-gray-100 text-gray-600" readonly>
                    <button type="button" onclick="togglePassword('current-password-display', 'eye-curr')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-blue-600 transition"><i class="fas fa-eye" id="eye-curr"></i></button>
                </div>
            </div>
            <form onsubmit="changePassword(event)" class="space-y-4 pt-4 border-t border-gray-200">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">กำหนดรหัสผ่านใหม่</label>
                    <div class="relative">
                        <input type="password" id="new-password" class="custom-input bg-white" placeholder="รหัสผ่านใหม่" required minlength="4">
                        <button type="button" onclick="togglePassword('new-password', 'eye-new')" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-blue-600 transition"><i class="fas fa-eye" id="eye-new"></i></button>
                    </div>
                </div>
                <button type="submit" class="w-full btn-primary">บันทึกรหัสผ่านใหม่</button>
            </form>
        </div>
        <div class="bg-gray-50 p-6 rounded-2xl border border-gray-100 text-left space-y-4 mt-6">
            <h3 class="font-bold text-gray-700 mb-2">ลายเซ็น (สำหรับแนบใบขออนุญาต)</h3>
            <div id="profile-sig-preview" class="border border-gray-200 rounded-xl bg-white h-24 flex items-center justify-center mb-2 overflow-hidden"><span class="text-gray-400 text-sm">ยังไม่มีลายเซ็น</span></div>
            <input type="file" id="profile-sig-upload" class="custom-input text-sm bg-white" accept="image/png" onchange="uploadProfileSig()">
            <p class="text-xs text-red-500 mt-1">*กรุณาถ่ายภาพลายเซ็นที่เขียนด้วยปากกาน้ำเงินบนกระดาษขาว (.png เท่านั้น)</p>
        </div>
    </div>
</div>
